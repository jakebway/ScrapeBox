          base64 --decode -i scrapebox-src.b64 -o scrapebox-src.tgz 2>/dev/null || base64 --decode < scrapebox-src.b64 > scrapebox-src.tgz
          tar -xzf scrapebox-src.tgz
          rm -f scrapebox-src.b64 scrapebox-src.tgz
          echo "   $(ls ScrapeBox/Sources | wc -l | tr -d ' ') code files unpacked"

          BUILD="${GITHUB_RUN_NUMBER:-1}"
          sed -i '' "s/CFBundleVersion: \"1\"/CFBundleVersion: \"$BUILD\"/" project.yml project-lite.yml
          echo "   Build number: $BUILD"

          echo "▶ Step 3/6: Drawing the app icon"
          python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || python3 -m pip install --quiet pillow
          python3 icon.py

          echo "▶ Step 4/6: Adding the VLC video engine (lets the app play MKV, AVI and more)"
          xcodegen generate >/dev/null
          command -v pod >/dev/null || brew install cocoapods >/dev/null
          VLC=0
          if pod install > pod.log 2>&1; then
            VLC=1
            echo "   VLC engine added"
          else
            echo "   ⚠️ Couldn't add the VLC engine; the app will still build, just without it."
            tail -25 pod.log
          fi

          build_app() {
            xcodebuild "$@" \
              -scheme ScrapeBox \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              clean build > xcodebuild.log 2>&1
          }

          echo "▶ Step 5/6: Building the app (takes a while)"
          status=0
          if [ "$VLC" = 1 ]; then
            build_app -workspace ScrapeBox.xcworkspace && status=0 || status=$?
            if [ "$status" -ne 0 ]; then
              echo "   ⚠️ Build with the VLC engine failed; building without it so you still get an app."
              grep -E "error:" xcodebuild.log | head -40 || true
              mv xcodebuild.log xcodebuild-with-vlc.log
              rm -rf Pods Podfile.lock ScrapeBox.xcworkspace build
              xcodegen generate >/dev/null
              build_app -project ScrapeBox.xcodeproj && status=0 || status=$?
              { echo; echo "===== Earlier attempt with the VLC engine ====="; cat xcodebuild-with-vlc.log; } >> xcodebuild.log
            fi
          else
            build_app -project ScrapeBox.xcodeproj && status=0 || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            # Last resort: build without the Lock Screen (Live Activity) widget, so you still get an app.
            echo "   ⚠️ Build failed; trying again without the Lock Screen widget."
            grep -E "error:" xcodebuild.log | head -40 || true
            mv xcodebuild.log xcodebuild-full.log
            rm -rf Pods Podfile.lock ScrapeBox.xcworkspace ScrapeBox.xcodeproj build
            xcodegen generate --spec project-lite.yml >/dev/null
            if [ "$VLC" = 1 ] && pod install >> pod.log 2>&1; then
              build_app -workspace ScrapeBox.xcworkspace && status=0 || status=$?
            fi
            if [ "$status" -ne 0 ]; then
              rm -rf Pods Podfile.lock ScrapeBox.xcworkspace build
              xcodegen generate --spec project-lite.yml >/dev/null
              build_app -project ScrapeBox.xcodeproj && status=0 || status=$?
            fi
            { echo; echo "===== Earlier attempt with the widget ====="; cat xcodebuild-full.log; } >> xcodebuild.log
            [ "$status" -eq 0 ] && echo "   Built without the Lock Screen widget (send Claude the build-log to get it back)."
          fi
          [ -f pod.log ] && { echo; echo "===== pod install ====="; cat pod.log; } >> xcodebuild.log
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | head -150 || true
          if [ "$status" -ne 0 ]; then
            echo "❌ The build failed. Scroll down to Artifacts on this run's page, download 'build-log' and send xcodebuild.log to Claude."
            exit "$status"
          fi

          echo "▶ Step 6/6: Packaging ScrapeBox.ipa"
          rm -rf Payload ScrapeBox.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScrapeBox.app Payload/
          zip -qry ScrapeBox.ipa Payload
          echo "✅ Done! ScrapeBox.ipa (build $BUILD) is ready: scroll down to Artifacts on this run's page."

      - name: Save the app
        uses: actions/upload-artifact@v4
        with:
          name: ScrapeBox-ipa
          path: ScrapeBox.ipa

      - name: Save the error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log
