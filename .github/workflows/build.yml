name: Build ScrapeBox
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Build ScrapeBox
        shell: bash
        run: |
          # =====================================================================
          #  ScrapeBox build script
          #  GitHub runs this on a Mac to turn the code below into ScrapeBox.ipa.
          #  You never need to edit this file. When Claude sends a new version,
          #  upload it to your repository to replace this one.
          # =====================================================================
          set -euo pipefail

          echo "▶ Step 1/6: Installing tools"
          brew install xcodegen >/dev/null
          # Newest Xcode on the machine (Xcode 26+ brings Liquid Glass; older ones still build the app).
          LATEST_XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9]*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$LATEST_XCODE" ]; then sudo xcode-select -s "$LATEST_XCODE" || true; fi
          echo "   $(xcodebuild -version | head -1)"

          echo "▶ Step 2/6: Writing the app's code"
          rm -rf ScrapeBox ScrapeBoxWidgets project.yml project-lite.yml Podfile Pods Podfile.lock ScrapeBox.xcworkspace ScrapeBox.xcodeproj build
          mkdir -p ScrapeBox/Sources ScrapeBox/Assets.xcassets/AppIcon.appiconset

          # The app's code, compressed (it's unpacked into the folders above).
          cat > scrapebox-src.b64 <<'SCRAPEBOX_EOF'
