          #  ScrapeBox build script
          #  GitHub runs this on a Mac to turn the code below into ScrapeBox.ipa.
          #  You never need to edit this file. When Claude sends a new version,
          #  upload it to your repository to replace this one.
          # =====================================================================
          set -euo pipefail

          echo "▶ Step 1/6: Installing tools"
          brew install xcodegen >/dev/null

